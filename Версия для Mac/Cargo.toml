[package]
name = "study-planner"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = "0.34"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
tray-icon = "0.21"
raw-window-handle = "0.6"

[profile.release]
opt-level = 2
strip = true
